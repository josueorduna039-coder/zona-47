
{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-2">
    <div class="col-12 col-md-6">
        <div class="card p-4">
            <h3 class="text-center mb-3 fw-bold text-primary fs-4">Registro de Personal</h3>
            <form method="POST">
                <div class="mb-2">
                    <label class="form-label small">Nombre Completo</label>
                    <input type="text" name="nombre" class="form-control form-control-sm" required>
                </div>
                <div class="mb-2">
                    <label class="form-label small">RFC</label>
                    <input type="text" name="rfc" class="form-control form-control-sm" required>
                </div>
                <div class="mb-2">
                    <label class="form-label small">Contraseña</label>
                    <input type="password" name="password" class="form-control form-control-sm" required>
                </div>
                <div class="mb-2">
                    <label class="form-label small">Rol en la Zona</label>
                    <select name="rol" class="form-select form-select-sm" required>
                        <option value="director">Director</option>
                        <option value="maestro_curso">Maestro frente al curso</option>
                        <option value="ninera">Niñer@</option>
                        <option value="musica">Maestro de acompañamiento musical</option>
                        <option value="intendente">Intendente</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label small">Escuela</label>
                    <input type="text" name="escuela" class="form-control form-control-sm" placeholder="Ej. Montes de Oca" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small">Teléfono / Celular</label>
                    <input type="text" name="telefono" class="form-control form-control-sm" required>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold btn-sm">Registrarse (Pendiente de Aprobación)</button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('login') }}" class="small text-decoration-none">¿Ya tienes cuenta? Inicia sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
