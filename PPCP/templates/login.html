{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="text-center mb-4 fw-bold text-primary">Iniciar Sesión</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">RFC o Usuario</label>
                    <input type="text" name="identifier" class="form-control" required placeholder="Ingresa tu RFC o usuario">
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required placeholder="Contraseña">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Entrar al Sistema</button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('register') }}" class="small text-decoration-none">¿Nueva maestra? Registrarse aquí</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
